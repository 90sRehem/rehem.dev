name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  pull_request:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_ORGANIZATION: ${{ vars.TF_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        shell: bash
        run: |
          if { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; } || [ "$TF_TRUSTED_PR" = "true" ]; then
            if [ -z "$TF_TOKEN_app_terraform_io" ] || [ -z "$TF_ORGANIZATION" ] || [ -z "$TF_WORKSPACE" ]; then
              echo "Terraform Cloud backend configuration is required for main deployments."
              exit 1
            fi
            terraform init \
              -backend-config="organization=$TF_ORGANIZATION" \
              -backend-config="workspaces.name=$TF_WORKSPACE"
          else
            terraform init -backend=false
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        shell: bash
        run: |
          if [ -z "$TF_VAR_cloudflare_api_token" ] || [ -z "$TF_VAR_cloudflare_account_id" ]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$TF_TRUSTED_PR" != "true" ]; then
              echo "Skipping Terraform plan because Cloudflare credentials are unavailable."
              exit 0
            fi
            echo "Cloudflare credentials are required for this Terraform plan."
            exit 1
          fi
          terraform plan -no-color -input=false

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
